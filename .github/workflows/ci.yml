name: Tests

on:
  push:
    branches: [main, "release/0.7.1-preparation"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same ref so rapid pushes don't pile up queued
# macOS jobs (scarce runners) and starve each other.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    # A hung or runner-starved job fails fast instead of lingering for hours.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      # Pure-Python package: the full interpreter range runs on Linux (cheap,
      # fast), with oldest+newest smoke tests on Windows and newest on macOS.
      # macOS runners are scarce, so a 5-version macOS leg queues and gets
      # cancelled; one macOS job keeps coverage without starving the runners.
      # ubuntu-24.04, not ubuntu-latest: ubuntu-latest moved to 26.04, whose
      # setup-python has no 3.9 build, so ubuntu-latest x 3.9 fails to install.
      matrix:
        include:
          - { os: ubuntu-24.04, python: '3.9' }
          - { os: ubuntu-24.04, python: '3.10' }
          - { os: ubuntu-24.04, python: '3.11' }
          - { os: ubuntu-24.04, python: '3.12' }
          - { os: ubuntu-24.04, python: '3.13' }
          - { os: windows-latest, python: '3.9' }
          - { os: windows-latest, python: '3.13' }
          - { os: macos-latest, python: '3.13' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[dev,events,attestation]"
      - run: python -m pytest -q
      # Dry runs must never contact the authenticated game endpoints.
      - run: python -m csr2cdn.prestige_release_validation
      - run: python -m csr2cdn.prestige_release_validation --ui-window --crew-filtered
      - run: python -m csr2cdn.crew_endpoint_inventory
      - run: python -m csr2cdn.crew_season_validation --simulate

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Verify installed wheel and extracted source distribution
        run: python tools/verify_distributions.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate-distributions
          path: dist/
          if-no-files-found: error
